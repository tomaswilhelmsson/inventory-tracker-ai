services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-tracker-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - backend_data:/app/backend/data
    command: sh -c "mkdir -p /app/backend/data && npx prisma migrate deploy && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: inventory-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  backend_data:
